spring.application.name=parking-service
# Shared settings (Eureka, actuator, tracing) and business values come from the config server
# (config-server/src/main/resources/config/). The values below are local defaults used if it is down.
spring.config.import=optional:configserver:${CONFIG_SERVER_URL:http://localhost:8888}

# The gateway listens on 8080 and forwards /api/** here.
# Railway (and most hosts) give the port in PORT; docker compose sets SERVER_PORT.
server.port=${PORT:${SERVER_PORT:8081}}
server.error.include-message=always
# Build Location headers and redirects with the gateway's host and port (X-Forwarded-* headers).
server.forward-headers-strategy=framework

spring.datasource.url=${DB_URL:jdbc:postgresql://aws-1-eu-central-1.pooler.supabase.com:5432/postgres?sslmode=require}
spring.datasource.username=${DB_USERNAME:postgres.fkodkbbogesliertcutp}
# Never commit the password: set DB_PASSWORD in the environment (or in the .env file used by docker compose).
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=org.postgresql.Driver
# The Supabase session pooler accepts only 15 clients in total. Keep each instance small so a redeploy
# (old + new instance running together) or a local run next to the deployed one does not hit the limit.
spring.datasource.hikari.maximum-pool-size=${DB_POOL_SIZE:5}
spring.datasource.hikari.minimum-idle=1

spring.jpa.hibernate.ddl-auto=update

spring.jpa.show-sql=${SHOW_SQL:false}

# Price used for reservations and receipts. TND amounts have 3 decimals (millimes).
parking.price-per-hour=1.500
parking.currency=TND
parking.pricing.source=local application.properties

# Kafka: reservation events (RESERVATION_CREATED, RESERVATION_ENDED) are published on this topic.
spring.kafka.bootstrap-servers=${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
spring.kafka.producer.key-serializer=org.apache.kafka.common.serialization.StringSerializer
spring.kafka.producer.value-serializer=org.apache.kafka.common.serialization.StringSerializer
# Do not block a reservation for a minute when Kafka is down: fail fast and log instead.
spring.kafka.producer.properties.max.block.ms=3000
# The trace continues from the HTTP request into the Kafka message (Tempo).
spring.kafka.template.observation-enabled=true
parking.kafka.reservation-topic=reservation-events
# Set KAFKA_ENABLED=false where no broker runs (e.g. Railway without Kafka): the topic is not created at startup.
spring.kafka.admin.auto-create=${KAFKA_ENABLED:true}

# Eureka is optional: set EUREKA_ENABLED=false when the gateway uses fixed URLs (e.g. on Railway).
eureka.client.enabled=${EUREKA_ENABLED:true}

# Browser origins allowed to call the API (comma separated), needed only if the front end is on another domain.
parking.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:4200,http://127.0.0.1:4200}

# OAuth2 resource server: Keycloak realm "parking". Tokens are issued for http://localhost:8180;
# inside Docker the signing keys are read from http://keycloak:8080 (KEYCLOAK_JWK_SET_URI).
spring.security.oauth2.resourceserver.jwt.issuer-uri=${KEYCLOAK_ISSUER_URI:http://localhost:8180/realms/parking}
spring.security.oauth2.resourceserver.jwt.jwk-set-uri=${KEYCLOAK_JWK_SET_URI:http://localhost:8180/realms/parking/protocol/openid-connect/certs}

# External service: current weather at a parking area (Open-Meteo, free, no API key).
parking.weather.base-url=https://api.open-meteo.com
parking.weather.connect-timeout=3s
parking.weather.read-timeout=5s
