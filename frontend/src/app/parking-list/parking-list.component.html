<div class="page">
  <h1>Parking areas</h1>

  <form class="row" (ngSubmit)="create()">
    <input name="name" [(ngModel)]="newName" placeholder="New parking area name" />
    <button type="submit" [disabled]="!newName.trim()">Create</button>
  </form>

  @if (error) {
    <p class="error">{{ error }}</p>
  }

  <table>
    <tr>
      <th>Name</th>
      <th>Capacity</th>
      <th>Occupancy</th>
      <th></th>
    </tr>
    @for (area of areas; track area.id) {
      <tr>
        <td>{{ area.name }}</td>
        <td>{{ area.capacity }}</td>
        <td>{{ area.occupancyRate | percent }}</td>
        <td><a [routerLink]="['/parking-areas', area.id]">Edit layout</a></td>
      </tr>
    } @empty {
      <tr>
        <td colspan="4">No parking area yet.</td>
      </tr>
    }
  </table>
</div>
