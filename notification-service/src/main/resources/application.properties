spring.application.name=notification-service
# Shared settings (Eureka, actuator, tracing) and the Resilience4j thresholds come from the config server.
spring.config.import=optional:configserver:${CONFIG_SERVER_URL:http://localhost:8888}
server.port=${PORT:${SERVER_PORT:8082}}
# Set EUREKA_ENABLED=false (and PARKING_SERVICE_URL) where no Eureka server runs, e.g. on Railway.
eureka.client.enabled=${EUREKA_ENABLED:true}
server.error.include-message=always

# Feign: empty URL = the parking service is found in Eureka (client-side load balancing).
# Set PARKING_SERVICE_URL (e.g. http://localhost:8081) to call a fixed address without Eureka.
parking-service.url=${PARKING_SERVICE_URL:}
spring.cloud.openfeign.client.config.parking-service.connect-timeout=2000
spring.cloud.openfeign.client.config.parking-service.read-timeout=3000
spring.cloud.openfeign.client.config.parking-service.logger-level=basic
spring.cloud.openfeign.micrometer.enabled=true

# Kafka consumer of the parking service's reservation events.
spring.kafka.bootstrap-servers=${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
spring.kafka.consumer.group-id=notification-service
spring.kafka.consumer.auto-offset-reset=earliest
spring.kafka.consumer.key-deserializer=org.apache.kafka.common.serialization.StringDeserializer
spring.kafka.consumer.value-deserializer=org.apache.kafka.common.serialization.StringDeserializer
spring.kafka.listener.observation-enabled=true
notification.kafka.reservation-topic=reservation-events

# OAuth2 resource server (Keycloak realm "parking"), see the parking service for the two URLs.
spring.security.oauth2.resourceserver.jwt.issuer-uri=${KEYCLOAK_ISSUER_URI:http://localhost:8180/realms/parking}
spring.security.oauth2.resourceserver.jwt.jwk-set-uri=${KEYCLOAK_JWK_SET_URI:http://localhost:8180/realms/parking/protocol/openid-connect/certs}

# Resilience4j defaults (the config server's notification-service.yml can override them).
resilience4j.circuitbreaker.instances.parkingService.sliding-window-type=COUNT_BASED
resilience4j.circuitbreaker.instances.parkingService.sliding-window-size=10
resilience4j.circuitbreaker.instances.parkingService.minimum-number-of-calls=5
resilience4j.circuitbreaker.instances.parkingService.failure-rate-threshold=50
resilience4j.circuitbreaker.instances.parkingService.slow-call-duration-threshold=2s
resilience4j.circuitbreaker.instances.parkingService.slow-call-rate-threshold=50
resilience4j.circuitbreaker.instances.parkingService.wait-duration-in-open-state=15s
resilience4j.circuitbreaker.instances.parkingService.permitted-number-of-calls-in-half-open-state=3
resilience4j.circuitbreaker.instances.parkingService.automatic-transition-from-open-to-half-open-enabled=true
resilience4j.circuitbreaker.instances.parkingService.register-health-indicator=true
resilience4j.circuitbreaker.instances.parkingService.ignore-exceptions=feign.FeignException$NotFound
resilience4j.retry.instances.parkingService.max-attempts=3
resilience4j.retry.instances.parkingService.wait-duration=500ms
resilience4j.retry.instances.parkingService.enable-exponential-backoff=true
resilience4j.retry.instances.parkingService.exponential-backoff-multiplier=2
resilience4j.retry.instances.parkingService.ignore-exceptions=feign.FeignException$NotFound,io.github.resilience4j.circuitbreaker.CallNotPermittedException
management.health.circuitbreakers.enabled=true

logging.level.com.parking.notification.client=DEBUG
